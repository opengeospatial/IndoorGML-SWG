name: generate_IndoorGML2_Part2
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    container: metanorma/metanorma:latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          path: main
      - name: checkout other repo
        uses: actions/checkout@v3 # checkout the repository content to github runner
        with:
          repository: opengeospatial/IndoorGML-SWG
      - name: Generate document
        run: |
          cd IndoorGML2/IndoorGML2_metanorma/Part II/XML
          metanorma compile --agree-to-terms -t ogc -x html,pdf standard_implementation/document.adoc
          cp standard/document.html ../../../../main/26-042.html
          cp standard/document.pdf ../../../../main/26-042.pdf
          cd IndoorGML2/IndoorGML2_metanorma/Part II/JSON
          metanorma compile --agree-to-terms -t ogc -x html,pdf standard_implementation/document.adoc
          cp standard/document.html ../../../../main/26-043.html
          cp standard/document.pdf ../../../../main/26-043.pdf
          cd IndoorGML2/IndoorGML2_metanorma/Part II/SQL
          metanorma compile --agree-to-terms -t ogc -x html,pdf standard_implementation/document.adoc
          cp standard/document.html ../../../../main/26-044.html
          cp standard/document.pdf ../../../../main/26-044.pdf
          cd ../../../../main
          git config --global user.name 'opengeospatial'
          git config --global user.email 'opengeospatial@users.noreply.github.com'
          git add 26-042.html 26-042.pdf 26-043.html 26-043.pdf 26-044.html 26-044.pdf
          git commit -am "Automated generation of HTML documents"
          git push
